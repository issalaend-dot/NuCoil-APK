name: Compilar APK Nativo C++
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android NDK y CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Firmar y compilar APK Release con motor C++
        run: |
          if [ -f "NuCoil-APK/settings.gradle" ]; then
            cd NuCoil-APK
          fi
          keytool -genkeypair -v -keystore app/nucoil-release.jks -alias nucoil -keyalg RSA -keysize 2048 -validity 10000 -storepass nucoil_release_key -keypass nucoil_release_key -dname "CN=NuCoil Engineering, OU=Biotechnology, O=Academic Project, C=MX"
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NuCoil-v1.0.apk"

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NuCoil-v1.0-APK
          path: NuCoil-v1.0.apk
